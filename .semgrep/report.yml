# Semgrep rules that are reported but do not fail the build, because each still
# has open findings in this repository.
# When a rule's findings are fixed, move it to block.yml.
rules:
  - id: toolkit-py-subprocess-inherits-environment
    languages: [python]
    severity: WARNING
    message: >-
      This child process inherits the whole parent environment, including any
      provider key. Pass env= with only what the child needs.
    patterns:
      - pattern-either:
          - pattern: subprocess.run(...)
          - pattern: subprocess.Popen(...)
          - pattern: subprocess.check_output(...)
          - pattern: subprocess.check_call(...)
          - pattern: subprocess.call(...)
      - pattern-not: subprocess.$F(..., env=..., ...)
    paths:
      exclude: ["tests/**"]
