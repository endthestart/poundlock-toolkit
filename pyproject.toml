[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "poundlock-toolkit"
version = "0.5.0"
description = "Bounded, evidence-led inference and coding harness qualification"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
readme = "README.md"
authors = [{ name = "Michael Anderson" }]
keywords = ["llm", "inference", "benchmark", "evaluation", "llama.cpp", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Source = "https://github.com/endthestart/poundlock-toolkit"
Issues = "https://github.com/endthestart/poundlock-toolkit/issues"
Changelog = "https://github.com/endthestart/poundlock-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
poundlock-toolkit = "poundlock_toolkit.cli:main"

[tool.setuptools.package-data]
poundlock_toolkit = ["data/*", "data/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The verifier is copied into each coding run's containers: editing it would change the measured fixture.
"src/poundlock_toolkit/data/*.py" = ["B", "UP", "SIM"]
