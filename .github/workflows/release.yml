name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    # The whole CI workflow on the tagged commit: secret, dependency and static
    # scans, every supported Python and the artifact build and install checks.
    # Nothing is published unless every job passes, and only the wheel and sdist
    # those jobs tested are published; nothing is rebuilt here.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Register this repository, workflow and environment as a trusted publisher on
    # PyPI; no API token is stored.
    environment:
      name: pypi
      url: https://pypi.org/project/poundlock-toolkit/
    permissions:
      contents: write # the GitHub release
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: poundlock-toolkit-${{ github.sha }}
          path: dist/
      - name: Check the tested artifacts and the tag agree
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test -f "dist/poundlock_toolkit-${version}-py3-none-any.whl"
          test -f "dist/poundlock_toolkit-${version}.tar.gz"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          # Evidence goes on the GitHub release, not to PyPI.
          mkdir evidence
          mv dist/SHA256SUMS dist/validation-environment.txt dist/*.cdx.json evidence/
          ls dist evidence
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* evidence/* --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --title "Poundlock Toolkit ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."
